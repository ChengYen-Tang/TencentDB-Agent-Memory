# One-command deployment for MemoryCore, MemoryProxy, MemoryKnowledge, and
# the MemoryPanel UI.
#
# 1. Copy .env.example to .env and fill the values.
# 2. docker compose up --build -d
#
# The TDAI internal credential is intentionally not passed to memory-proxy;
# the Codex credential is intentionally not passed to tdai-gateway.

name: tdai-codex-memory

services:
  tdai-gateway:
    build:
      context: ./MemoryCore
      dockerfile: Dockerfile
    image: ${TDAI_CORE_IMAGE:-tencentdb-agent-memory:local}
    environment:
      TDAI_GATEWAY_HOST: "0.0.0.0"
      TDAI_GATEWAY_CONFIG: /data/config/tdai-gateway.yaml
      TDAI_DATA_DIR: /data/tdai-memory
      TDAI_GATEWAY_API_KEY: "${TDAI_GATEWAY_API_KEY:?Set TDAI_GATEWAY_API_KEY in .env}"
      TDAI_LLM_PROVIDER: openai
      TDAI_LLM_BASE_URL: "${TDAI_INTERNAL_LLM_BASE_URL:?Set TDAI_INTERNAL_LLM_BASE_URL in .env}"
      TDAI_LLM_API_KEY: "${TDAI_INTERNAL_LLM_API_KEY:?Set TDAI_INTERNAL_LLM_API_KEY in .env}"
      TDAI_LLM_MODEL: "${TDAI_INTERNAL_LLM_MODEL:-gpt-4o}"
      TDAI_LLM_TIMEOUT_MS: "${TDAI_INTERNAL_LLM_TIMEOUT_MS:-120000}"
      TDAI_LLM_REASONING_EFFORT: "${TDAI_INTERNAL_LLM_REASONING_EFFORT:-}"
    volumes:
      - ./MemoryCore/tdai-gateway.standalone.yaml:/data/config/tdai-gateway.yaml:ro
      - tdai-memory-data:/data/tdai-memory
    restart: unless-stopped

  # Wiki, Knowledge Map, and Code Graph. Wiki ingestion deliberately shares
  # the TDAI internal LLM account below; Code Graph itself uses no LLM.
  memory-knowledge:
    build:
      context: ./MemoryKnowledge
      dockerfile: Dockerfile
    image: ${TDAI_KNOWLEDGE_IMAGE:-team-knowledge:local}
    ports:
      - "${TDAI_KNOWLEDGE_HOST_PORT:-8421}:8421"
    environment:
      KNOWLEDGE_DATA_DIR: /app/data
      KNOWLEDGE_DB_PATH: /app/data/knowledge.db
      # This URL is handed to Codex in its knowledge-tool recipes, so it must
      # be reachable from every Codex machine and must include /v3.
      KNOWLEDGE_PUBLIC_BASE_URL: "${TDAI_KNOWLEDGE_EXTERNAL_URL:-http://172.30.1.251:8421/v3}"
      # The callback stays on the private Docker network.
      TMC_CALLBACK_URL: "http://memory-panel:8123"
      LLM_MODE: custom
      LLM_PROTOCOL: openai
      LLM_API_KEY: "${TDAI_INTERNAL_LLM_API_KEY:?Set TDAI_INTERNAL_LLM_API_KEY in .env}"
      LLM_BASE_URL: "${TDAI_INTERNAL_LLM_BASE_URL:?Set TDAI_INTERNAL_LLM_BASE_URL in .env}"
      LLM_MODEL: "${TDAI_INTERNAL_LLM_MODEL:-gpt-4o}"
      # The canonical maxTokens source is the same Gateway YAML used by
      # tdai-gateway. MemoryKnowledge reads llm.maxTokens from this mount.
      TDAI_SHARED_LLM_CONFIG: /app/tdai-gateway.shared.yaml
      # Wiki is an internal TDAI workload, so it deliberately shares the same
      # optional reasoning budget as MemoryCore rather than Codex's account.
      LLM_REASONING_EFFORT: "${TDAI_INTERNAL_LLM_REASONING_EFFORT:-}"
      LLM_TIMEOUT_MS: "${TDAI_KNOWLEDGE_LLM_TIMEOUT_MS:-1200000}"
      KNOWLEDGE_WIKI_INGEST_CONCURRENCY: "${TDAI_KNOWLEDGE_WIKI_INGEST_CONCURRENCY:-3}"
      KNOWLEDGE_LLM_GLOBAL_CONCURRENCY: "${TDAI_KNOWLEDGE_LLM_GLOBAL_CONCURRENCY:-5}"
      # Initial repository indexing is automatic; periodic git polling is
      # opt-in because it repeatedly contacts every registered repository.
      KNOWLEDGE_AUTO_SYNC_ENABLED: "${TDAI_KNOWLEDGE_AUTO_SYNC_ENABLED:-false}"
      KNOWLEDGE_AUTO_SYNC_SCAN_INTERVAL_MIN: "${TDAI_KNOWLEDGE_AUTO_SYNC_SCAN_INTERVAL_MIN:-10}"
      KNOWLEDGE_AUTO_SYNC_MAX_CONCURRENT: "${TDAI_KNOWLEDGE_AUTO_SYNC_MAX_CONCURRENT:-3}"
    volumes:
      - tdai-knowledge-data:/app/data
      - ./MemoryCore/tdai-gateway.standalone.yaml:/app/tdai-gateway.shared.yaml:ro
    restart: unless-stopped

  memory-proxy:
    build:
      context: ./MemoryProxy
      dockerfile: Dockerfile
    image: ${TDAI_PROXY_IMAGE:-tencentdb-memory-proxy:local}
    depends_on:
      tdai-gateway:
        condition: service_healthy
      memory-knowledge:
        condition: service_healthy
    ports:
      - "${TDAI_PROXY_HOST_PORT:-8317}:8096"
    environment:
      CODEX_LLM_BASE_URL: "${CODEX_LLM_BASE_URL:?Set CODEX_LLM_BASE_URL in .env}"
      CODEX_LLM_API_KEY: "${CODEX_LLM_API_KEY:?Set CODEX_LLM_API_KEY in .env}"
      TDAI_PROXY_EXTERNAL_URL: "${TDAI_PROXY_EXTERNAL_URL:-http://172.30.1.251:8317}"
      TDAI_GATEWAY_API_KEY: "${TDAI_GATEWAY_API_KEY:?Set TDAI_GATEWAY_API_KEY in .env}"
      TDAI_SERVICE_ID: "${TDAI_SERVICE_ID:-default}"
    volumes:
      - ./MemoryProxy/config.codex-split.example.yaml:/data/config.yaml:ro
      - tdai-proxy-data:/data/tdai-memory-proxy
    restart: unless-stopped

  memory-panel:
    build:
      context: ./MemoryPanel
      dockerfile: docker/local/Dockerfile.local
    image: ${TDAI_PANEL_IMAGE:-team-memory-control:local}
    depends_on:
      tdai-gateway:
        condition: service_healthy
      memory-knowledge:
        condition: service_healthy
    ports:
      - "${TDAI_PANEL_HOST_PORT:-8123}:8123"
    environment:
      HOST: "0.0.0.0"
      PORT: "8123"
      UI_DIST_DIR: ./web/dist
      METADATA_INSTANCES_CONFIG: /run/tdai-panel/metadata-instances.json
      METADATA_REMOTE_TIMEOUT_MS: "15000"
      KNOWLEDGE_SERVICE_URL: "http://memory-knowledge:8421"
      KNOWLEDGE_TIMEOUT_MS: "${TDAI_KNOWLEDGE_TIMEOUT_MS:-30000}"
      # MemoryKnowledge calls the shared internal LLM directly, rather than
      # receiving a billed key through the Codex proxy.
      KNOWLEDGE_LLM_BINDING_SYNC: "false"
      TDAI_GATEWAY_API_KEY: "${TDAI_GATEWAY_API_KEY:?Set TDAI_GATEWAY_API_KEY in .env}"
      TDAI_SERVICE_ID: "${TDAI_SERVICE_ID:-default}"
      TDAI_PANEL_INSTANCE_NAME: "${TDAI_PANEL_INSTANCE_NAME:-TDAI Memory}"
      TDAI_PANEL_GATEWAY_ENDPOINT: "http://tdai-gateway:8420"
      TDAI_PANEL_PROXY_ENDPOINT: "${TDAI_PROXY_EXTERNAL_URL:-http://172.30.1.251:8317}"
    entrypoint: ["/bin/sh", "/app/docker/compose-entrypoint.sh"]
    restart: unless-stopped

volumes:
  tdai-memory-data:
  tdai-proxy-data:
  tdai-knowledge-data:
