# Standalone TDAI Gateway: no Redis, Shark, TCVDB, or COS is required.
#
# Quick start:
#   cp .env.example .env
#   # Set TDAI_LLM_API_KEY in .env, then:
#   docker compose -f docker-compose.local.yaml up --build -d
#
# The published port is loopback-only by default. To deliberately expose the
# gateway outside this host, set TDAI_GATEWAY_BIND_ADDRESS=0.0.0.0 and also set
# TDAI_GATEWAY_API_KEY to a strong secret.

services:
  tdai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TDAI_IMAGE:-tencentdb-agent-memory:local}
    ports:
      - "${TDAI_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${TDAI_GATEWAY_HOST_PORT:-8420}:8420"
    environment:
      # The process must listen on all container interfaces; the `ports`
      # binding above controls which host interfaces can reach it.
      TDAI_GATEWAY_HOST: "0.0.0.0"
      TDAI_GATEWAY_CONFIG: /data/config/tdai-gateway.yaml
      TDAI_DATA_DIR: /data/tdai-memory
      TDAI_LLM_API_KEY: "${TDAI_LLM_API_KEY:?Set TDAI_LLM_API_KEY in .env or your shell}"
      TDAI_LLM_BASE_URL: "${TDAI_LLM_BASE_URL:-https://api.openai.com/v1}"
      TDAI_LLM_MODEL: "${TDAI_LLM_MODEL:-gpt-4o}"
      TDAI_LLM_MAX_TOKENS: "${TDAI_LLM_MAX_TOKENS:-4096}"
      TDAI_LLM_TIMEOUT_MS: "${TDAI_LLM_TIMEOUT_MS:-120000}"
      # Empty means unset, preserving the model's default reasoning behavior.
      TDAI_LLM_REASONING_EFFORT: "${TDAI_LLM_REASONING_EFFORT:-}"
      # Keep this empty for localhost-only development. Set it before exposing
      # the host port on a LAN or the internet.
      TDAI_GATEWAY_API_KEY: "${TDAI_GATEWAY_API_KEY:-}"
    volumes:
      - ./tdai-gateway.standalone.yaml:/data/config/tdai-gateway.yaml:ro
      - tdai-memory-data:/data/tdai-memory
    restart: unless-stopped

volumes:
  tdai-memory-data:
